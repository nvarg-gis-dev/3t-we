<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3T Consultores</title>
<meta name="description" content="3T Consultores: ingeniería MEP y protección contra incendios en Panamá. Diseño de rociadores, alarma contra incendios, aire acondicionado, electricidad, fontanería y seguridad humana.">
<meta property="og:title" content="3T Consultores · Ingeniería MEP y protección contra incendios">
<meta property="og:description" content="Diseñamos los sistemas que protegen, climatizan e iluminan sus edificios. Ciudad de Panamá.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%235f6166'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-weight='700' font-size='30' fill='white'%3E3T%3C/text%3E%3Crect y='56' width='16' height='8' fill='%23d93a2b'/%3E%3Crect x='16' y='56' width='16' height='8' fill='%232a7bd4'/%3E%3Crect x='32' y='56' width='16' height='8' fill='%23e5a210'/%3E%3Crect x='48' y='56' width='16' height='8' fill='%23119485'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Clean architectural grid with MEP layer colors: each discipline keeps one color site-wide (fire red, alarm orange, HVAC blue, lighting amber, plumbing teal, life-safety green). Dark drawing panels carry the animated technical drawings. */
:root{
  --bg:#fafaf8;--surface:#ffffff;--ink:#16181c;--muted:#6a6c70;--line:#e2e2df;--tint:#f2f2ef;
  --night:#14171c;--night-2:#1b1f25;--night-ink:#eef0f2;--night-muted:#a3abb4;--night-line:rgba(255,255,255,.08);
  --brand:#b4551d;
  --fire:#d93a2b;--hvac:#2a7bd4;--light:#e5a210;--plumb:#119485;--alarm:#ee6a17;--safe:#2a9a4c;
  --display:"Jost","Futura","Century Gothic",Arial,sans-serif;--body:"Jost","Futura","Century Gothic",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--surface:#171a1e;--ink:#eceef0;--muted:#9a9ca0;--line:#2a2d32;--tint:#14171a;--night:#0b0d10;--night-2:#12151a;--brand:#e07a3c;--fire:#f0584a;--hvac:#4f9bf0;--light:#f2b836;--plumb:#2fb8a7;--alarm:#ff8a3d;--safe:#45c06a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101215;--surface:#171a1e;--ink:#eceef0;--muted:#9a9ca0;--line:#2a2d32;--tint:#14171a;--night:#0b0d10;--night-2:#12151a;--brand:#e07a3c;--fire:#f0584a;--hvac:#4f9bf0;--light:#f2b836;--plumb:#2fb8a7;--alarm:#ff8a3d;--safe:#45c06a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.06;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,5vw,4.4rem)}
h2{font-size:clamp(1.8rem,3.2vw,2.7rem)}
h3{font-size:1.25rem;letter-spacing:-.01em}
p{margin:0;max-width:62ch}
:focus-visible{outline:2px solid var(--hvac);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(18px,4.5vw,64px)}
.label{font:500 .74rem/1.4 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:clamp(1.05rem,1.35vw,1.2rem);color:var(--muted);margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 .95rem/1 var(--body);padding:15px 22px;border-radius:999px;background:var(--fire);color:#fff;border:1px solid var(--fire);transition:transform .2s,box-shadow .2s;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px var(--fire)}
.btn.small{padding:10px 16px;font-size:.84rem}
.btn.line{background:transparent;color:inherit;border-color:currentColor}
.btn.line:hover{box-shadow:none}
.btn.line.dark{color:var(--ink);border-color:var(--line)}
.btn.white{background:#fff;color:#16181c;border-color:#fff}
.arrowlink{display:inline-block;margin-top:22px;font-weight:500;color:var(--c,var(--ink));border-bottom:1px solid currentColor;padding-bottom:3px}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:26px;height:74px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:6px;background:#5f6166;color:#fff;display:grid;place-items:center;font:600 1.1rem/1 var(--display);letter-spacing:-.04em;position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--fire) 0 25%,var(--hvac) 25% 50%,var(--light) 50% 75%,var(--plumb) 75%)}
.brand b{font:500 .85rem/1 var(--body);letter-spacing:.24em}
nav{margin-left:auto;display:flex;gap:26px;align-items:center}
nav a:not(.btn){font:500 .82rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0;border-bottom:2px solid transparent}
nav a:not(.btn):hover{color:var(--ink)}
nav a:not(.btn)[aria-current="page"]{color:var(--ink);border-color:var(--fire)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;border-radius:999px;padding:6px 10px;font:500 .74rem/1 var(--body);letter-spacing:.1em;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink);font:500 .78rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  nav{display:none;position:absolute;left:0;right:0;top:74px;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0;padding:6px clamp(18px,4.5vw,64px) 18px}
  nav a:not(.btn){padding:14px 0;border-bottom:1px solid var(--line)}
  nav .navcta{margin-top:14px;justify-content:center}
  nav.open{display:flex}
}

section{padding:clamp(64px,8vw,112px) 0}
.head{display:grid;gap:12px;margin-bottom:40px;max-width:760px}
.tint{background:var(--tint)}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(32px,5vw,72px)}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.gridbg{background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:32px 32px}

/* hero */
.hero{background:var(--night);color:var(--night-ink);padding:clamp(40px,5vw,72px) 0 0;background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:32px 32px}
.hero-grid{display:grid;grid-template-columns:5fr 7fr;gap:44px;align-items:start}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero .label{color:var(--night-muted)}
.hero h1{font-size:clamp(2.2rem,4.2vw,3.7rem);margin-top:22px}
.hero h1 .f{color:var(--fire)}.hero h1 .h{color:var(--hvac)}.hero h1 .l{color:var(--light)}
.hero .lead{color:#b4bbc3}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.simbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.simbar .label{color:var(--night-muted)}
.simbtn{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:10px 16px;font:500 .86rem/1 var(--body);cursor:pointer;transition:background .2s}
.simbtn:hover{background:rgba(255,255,255,.12)}
.dotr{width:9px;height:9px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 4px color-mix(in srgb,var(--fire) 30%,transparent)}
.section-svg{width:100%;height:auto;display:block}
.section-svg .layer,.section-svg .people{transition:opacity .35s}
.log{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;min-height:0;font-size:.9rem;color:#d6dbe0}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.05);border-left:3px solid var(--alarm);animation:logIn .35s ease-out}
.log time{font-variant-numeric:tabular-nums;color:var(--alarm);font-weight:500}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.legend-wrap{margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1)}
.hint{font-size:.88rem;color:var(--night-muted);margin-bottom:14px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.legend{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.legend{grid-template-columns:1fr}}
.leg{display:flex;gap:12px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;color:var(--night-ink);cursor:pointer;font:inherit;transition:border-color .2s,background .2s}
.leg:hover,.leg[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.leg i{width:22px;height:4px;border-radius:2px;background:var(--c);margin-top:9px;flex:none}
.leg b{display:block;font-weight:500;font-size:.95rem}
.leg small{display:block;color:var(--night-muted);font-size:.8rem;line-height:1.4;margin-top:2px}
.figures{display:grid;grid-template-columns:repeat(4,1fr);margin-top:36px;border-top:1px solid rgba(255,255,255,.12)}
.figures div{padding:24px 0 32px 24px;border-right:1px solid rgba(255,255,255,.12)}
.figures div:first-child{padding-left:0}
.figures div:last-child{border-right:0}
.figures b{display:block;font:400 clamp(2.2rem,4vw,3.3rem)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#fff}
.figures span{display:block;margin-top:10px;font-size:.88rem;color:var(--night-muted)}
@media (max-width:700px){.figures{grid-template-columns:1fr 1fr}.figures div:nth-child(2){border-right:0}.figures div:nth-child(3){padding-left:0}.figures div:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.12)}}

/* drawing animations */
@media (prefers-reduced-motion:no-preference){
  .air{stroke-dasharray:3 5;animation:flow 1.6s linear infinite}
  .water{stroke-dasharray:6 6;animation:flow 2.4s linear infinite}
  .strobe{animation:pulse 1.8s ease-in-out infinite}
  .glow{animation:glow 4s ease-in-out infinite}
  .blink{animation:pulse 1.4s ease-in-out infinite}
  .spin{animation:spin 1.2s linear infinite}
  .pulse{stroke-dasharray:6 40;animation:flow2 1.4s linear infinite}
  .slc{stroke-dasharray:5 30;animation:flow2 2.2s linear infinite}
  .drop{animation:drop 1.6s ease-in infinite}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .35s ease-in-out infinite alternate}
  .sprayon line{stroke-dasharray:4 6;animation:flow 0.7s linear infinite}
  .scan{animation:scan 5s ease-in-out infinite}
  .tick{stroke-dasharray:30;stroke-dashoffset:30;animation:tick 2.8s ease infinite}
  .smoke{animation:smoke 2.4s ease-out infinite}
  .mini .dr{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s ease forwards}
  .hd{animation:pop .4s ease-out backwards}
}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes flow2{to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
@keyframes scan{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,70px)}}
@keyframes tick{0%,30%{stroke-dashoffset:30}50%,100%{stroke-dashoffset:0}}
@keyframes smoke{from{transform:translateY(0);opacity:.7}to{transform:translateY(-22px);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes walk{to{transform:translateX(var(--dx))}}
@keyframes shrink{to{transform:scale(.15);opacity:.2}}
.hd{transform-box:fill-box;transform-origin:center}

/* fire simulation states */
.sim .fmo{opacity:0;transition:opacity .5s}
.sim.fm .fire-ev{opacity:1}
.flamewrap{transform-box:fill-box;transform-origin:50% 100%}
.sim.s1 .det{fill:var(--fire);stroke:var(--fire);animation:pulse .5s steps(2) infinite}
.sim.s2 .strobe{animation:pulse .45s steps(2) infinite;stroke-width:2.4}
.sim.s2 .facp{animation:pulse .6s steps(2) infinite}
.sim.s3 .air{animation:none;opacity:.08}
.sim.s3 .fan{opacity:.3}
.sim.s3 .press{opacity:1}
.sim.s4 .route{opacity:1}
.sim.s4 .exitsign{animation:pulse .8s steps(2) infinite}
.sim.s4 .person{animation:walk 6s ease-in forwards}
.sim.s5 .spray{opacity:1}
.sim.s5 .flamewrap{animation:shrink 3.5s ease-in forwards}
.sim.s5 .smoke{opacity:.4}
.sim.s6 .wflow{opacity:1;animation:flow 0.8s linear infinite}
.sim.s6 .pump{animation:pulse .7s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.sim.s4 .person{transform:translateX(var(--dx))}.sim.s5 .flamewrap{transform:scale(.15)}}

/* systems in detail */
.sys{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.sys{grid-template-columns:1fr}}
.systabs{display:grid;gap:8px}
@media (max-width:900px){.systabs{display:flex;flex-wrap:wrap}}
.systab{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:500 .98rem/1.2 var(--body);color:var(--muted);cursor:pointer;transition:all .2s}
.systab i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.systab:hover{color:var(--ink)}
.systab[aria-selected="true"]{color:var(--ink);border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.sp{display:grid;grid-template-columns:1.2fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:logIn .3s ease-out}
@media (max-width:760px){.sp{grid-template-columns:1fr}}
.spart{background:var(--night);padding:18px;display:grid;place-items:center;background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:24px 24px}
.mini{width:100%;height:auto;display:block}
.mini text{font:500 8.5px var(--body);letter-spacing:.14em;fill:var(--night-muted)}
.sptext{padding:28px}
.sptext h3{font-size:1.6rem;color:var(--ink)}
.sptext p{color:var(--muted);margin-top:10px}
.sptext ul,.disc ul{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:0}
.sptext li,.disc li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line);position:relative}
.sptext li::before,.disc li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:3px;border-radius:2px;background:var(--c)}
.codes{margin-top:16px;font:500 .8rem/1.6 var(--body);letter-spacing:.08em;color:var(--c)}
.codes span{color:var(--muted);margin-right:6px}

/* process teaser + sectors */
.steps-mini{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:0;counter-reset:s}
.steps-mini li{display:flex;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.steps-mini span{font-size:.8rem;letter-spacing:.1em;color:var(--fire);font-weight:500}
.steps-mini b{font-weight:500}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
@media (max-width:520px){.sgrid{grid-template-columns:1fr}}
.scard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,transform .2s}
.scard:hover{border-color:var(--ink);transform:translateY(-2px)}
.scard b{font:400 2rem/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scard h3{font-size:1.05rem}
.scard small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}

/* page head */
.phead{background:var(--night);color:var(--night-ink);padding:clamp(56px,7vw,96px) 0 clamp(44px,5vw,64px);position:relative;background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:32px 32px}
.phead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--fire) 0 16.6%,var(--alarm) 16.6% 33.3%,var(--hvac) 33.3% 50%,var(--light) 50% 66.6%,var(--plumb) 66.6% 83.3%,var(--safe) 83.3%)}
.phead .label{color:var(--night-muted)}
.phead h1{margin-top:16px;max-width:20ch}
.phead .lead{color:#b4bbc3}

/* services page */
.disc{--c:var(--ink);display:grid;grid-template-columns:1fr 1.1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:20px}
.disc:nth-child(even) .discart{order:2}
.discart{background:var(--night);display:grid;place-items:center;padding:22px;border-top:4px solid var(--c);background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:24px 24px}
.disctext{padding:clamp(24px,3vw,40px)}
.disctext h2{font-size:clamp(1.5rem,2.3vw,2rem)}
.disctext .sum{color:var(--muted);margin-top:10px}
@media (max-width:860px){.disc{grid-template-columns:1fr}.disc:nth-child(even) .discart{order:0}}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.filters button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:500 .92rem/1 var(--body);color:var(--muted);cursor:pointer}
.filters button sup{font-size:.7rem;margin-left:4px}
.filters button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s}
.pcard:hover{transform:translateY(-3px)}
.pcard .art{aspect-ratio:16/10;background:var(--night);display:block}
.pcard .art svg{width:100%;height:100%;display:block}
.pcard .t{padding:14px 16px}
.pcard b{display:block;font:500 1.12rem/1.2 var(--display)}
.pcard small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.index{margin-top:48px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.index ul{margin:16px 0 0;padding:0;list-style:none;columns:3 220px;column-gap:36px}
.index li{padding:8px 0;border-bottom:1px solid var(--line);break-inside:avoid;color:var(--muted)}
.ctable{margin-top:12px}
.ctable div{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.ctable b{font-weight:500}.ctable span{color:var(--muted)}
@media (max-width:700px){.ctable div{grid-template-columns:1fr;gap:2px}}

/* about */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;border-top:4px solid var(--c)}
.panel h3{margin-bottom:16px}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;color:var(--muted)}
.creds{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.creds div{border-radius:14px;padding:26px;background:var(--night);color:var(--night-ink)}
.creds b{display:block;font:500 2rem/1 var(--display)}
.creds span{display:block;margin-top:10px;color:var(--night-muted);font-size:.92rem}
@media (max-width:700px){.creds{grid-template-columns:1fr}}
.darkband{background:var(--night);color:var(--night-ink);background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:32px 32px}
.darkband .label{color:var(--night-muted)}
.darkband .lead{color:#b4bbc3}
.proc{display:grid;grid-template-columns:360px 1fr;gap:36px;align-items:start}
@media (max-width:900px){.proc{grid-template-columns:1fr}}
.psteps{display:grid;gap:8px}
.pstep{display:grid;grid-template-columns:34px 1fr;column-gap:10px;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;color:var(--night-ink);font:inherit;cursor:pointer;transition:all .2s}
.pstep span{grid-row:span 2;color:var(--fire);font-weight:500;font-size:.85rem;letter-spacing:.08em;padding-top:2px}
.pstep b{font-weight:500}
.pstep small{display:none;color:var(--night-muted);font-size:.86rem;line-height:1.45;margin-top:4px}
.pstep[aria-pressed="true"]{border-color:var(--fire);background:color-mix(in srgb,var(--fire) 12%,transparent)}
.pstep[aria-pressed="true"] small{display:block}
.sim.static .section-svg .layer{transition:opacity .6s}

/* proposal */
.prop{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
@media (max-width:960px){.prop{grid-template-columns:1fr}}
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,3vw,36px);display:grid;gap:26px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:14px}
legend{font:500 1.1rem/1.2 var(--display);margin-bottom:12px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-size:.92rem;color:var(--muted);transition:all .15s;background:var(--bg)}
.chip.c span i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip input:checked+span{border-color:var(--ink);color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.chip.c input:checked+span{border-color:var(--c);box-shadow:0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.chip input:focus-visible+span{outline:2px solid var(--hvac);outline-offset:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
label{display:grid;gap:8px;font:500 .82rem/1 var(--body);letter-spacing:.04em;color:var(--muted)}
input,select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--hvac);box-shadow:0 0 0 3px color-mix(in srgb,var(--hvac) 20%,transparent)}
textarea{min-height:110px;resize:vertical}
.rng{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}
.rng input[type=range]{padding:0;accent-color:var(--fire);border:0;background:none}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--light);padding:6px 12px}
.note.dark{color:var(--night-muted)}
.ok{display:none;color:var(--plumb);font-weight:500}
.ok.err{color:var(--fire)}
.hp{position:absolute;left:-9999px;opacity:0;pointer-events:none}
.btn.wa{background:#1f9d55;border-color:#1f9d55}
.btn.wa:hover{box-shadow:0 10px 24px -12px #1f9d55}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:12px;flex-wrap:wrap}
.summary{position:sticky;top:96px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;border-top:4px solid var(--fire)}
.summary dl{margin:14px 0 0;display:grid;gap:0}
.summary dl div{padding:10px 0;border-bottom:1px solid var(--line)}
.summary dt{font-size:.8rem;color:var(--muted)}
.summary dd{margin:2px 0 0;font-weight:500}
.dlist{display:flex;flex-wrap:wrap;gap:6px}
.dlist span{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.dlist i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.docs{margin:12px 0 20px;padding:0;list-style:none;display:grid;gap:8px;font-size:.92rem;color:var(--muted)}
.docs li{padding-left:24px;position:relative}
.docs li::before{content:"";position:absolute;left:2px;top:6px;width:10px;height:6px;border-left:2px solid var(--plumb);border-bottom:2px solid var(--plumb);transform:rotate(-45deg)}
.copymsg{font-size:.86rem;color:var(--plumb);margin-top:8px}
.est{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media (max-width:900px){.est{grid-template-columns:1fr}}
.estin{display:grid;gap:16px}
.estin label{color:var(--night-muted)}
.estin input,.estin select{background:var(--night-2);color:var(--night-ink);border-color:rgba(255,255,255,.14)}
.estin select option{background:var(--night-2)}
.estout .big{display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.estout .big b{font:400 3.4rem/1 var(--display);color:var(--fire);font-variant-numeric:tabular-nums}
.estout .big span{color:var(--night-muted)}
.estout dl{margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.estout dl div{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.estout dt{font-size:.8rem;color:var(--night-muted)}
.estout dd{margin:2px 0 0;font-variant-numeric:tabular-nums}
.estout .tot dd{color:#fff;font-weight:500}
.estplan{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px}
.estplan svg{width:100%;height:auto;max-height:520px;display:block}
.direct{display:grid;grid-template-columns:auto 1.4fr 1fr 1fr 1.6fr;gap:28px;align-items:baseline;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.direct small{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.direct .mail{font:500 1.3rem/1.2 var(--display);word-break:break-word}
@media (max-width:1000px){.direct{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.direct{grid-template-columns:1fr}}

/* cta + footer */
.cta .box{background:linear-gradient(120deg,var(--fire),var(--alarm));color:#fff;border-radius:20px;padding:clamp(32px,5vw,60px);display:flex;gap:28px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cta .box p{color:rgba(255,255,255,.9);margin-top:10px}
footer{background:var(--night);color:var(--night-muted);padding:56px 0 32px;font-size:.92rem}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:36px}
@media (max-width:820px){footer .cols{grid-template-columns:1fr}}
footer h4{margin:0 0 16px;font:500 .74rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:#fff}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a:hover{color:#fff}
footer .brand b{color:#fff}
footer .legal{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 <section><div class="wrap"><div class="direct">
  <span class="label">${x.directLabel}</span>
  <div><a class="mail" href="mailto:${CONTACT.email}">${CONTACT.email}</a></div>
  <div><small>${x.phone}</small>${CONTACT.phone}</div>
  <div><small>WhatsApp</small><a href="https://wa.me/${WHATSAPP}">${CONTACT.phone}</a></div>
  <div><small>${x.office}</small>${L2(CONTACT.addr,CONTACT.addrEn)}</div>
 </div></div></section>`;
}

const RENDER={inicio:home,servicios:services,proyectos:projects,nosotros:about,propuesta:proposal};

/* ---------- behaviour ---------- */
function setFocus(svg,layer){svg.querySelectorAll(".layer").forEach(g=>g.style.opacity=!layer||g.dataset.l===layer?"":".1");const pe=svg.querySelector(".people");if(pe)pe.style.opacity=layer?".1":""}
function bindSim(){
 const box=$("#sim");if(!box)return;const svg=box.querySelector("svg");let pinned=null;
 $$(".leg").forEach(b=>{
  b.addEventListener("mouseenter",()=>setFocus(svg,b.dataset.layer));
  b.addEventListener("focus",()=>setFocus(svg,b.dataset.layer));
  b.addEventListener("mouseleave",()=>setFocus(svg,pinned));
  b.addEventListener("blur",()=>setFocus(svg,pinned));
  b.addEventListener("click",()=>{pinned=pinned===b.dataset.layer?null:b.dataset.layer;$$(".leg").forEach(o=>o.setAttribute("aria-pressed",o.dataset.layer===pinned));setFocus(svg,pinned)});
 });
 const btn=$("#simBtn"),log=$("#log"),x=S[lang];
 const reset=()=>{simTimers.forEach(clearTimeout);simTimers=[];box.className="sim";log.innerHTML="";btn.innerHTML=`<span class="dotr"></span>${x.simRun}`};
 btn.addEventListener("click",()=>{
  if(box.classList.contains("fm")){reset();return}
  reset();box.classList.add("fm");btn.innerHTML=x.simReset;
  [0,1200,2600,3800,6000,7200].forEach((ms,i)=>simTimers.push(setTimeout(()=>{box.classList.add("s"+(i+1));const li=document.createElement("li");li.innerHTML=`<time>${x.log[i][0]}</time>${x.log[i][1]}`;log.appendChild(li)},ms)));
 });
}
function bindSys(){
 const panel=$("#syspanel");if(!panel)return;
 const show=id=>{panel.innerHTML=sysPanel(id);$$(".systab").forEach(b=>b.setAttribute("aria-selected",b.dataset.sys===id))};
 $$(".systab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.sys)));show(sysList()[0].id);
}
const PROC_LAYERS=[[],["hvac"],["hvac","plumb","light","fire","alarm"],LAYERS,LAYERS,LAYERS];
function showProc(i){
 procStep=i;const svg=$("#procSim svg");if(!svg)return;
 svg.querySelectorAll(".layer").forEach(g=>g.style.opacity=PROC_LAYERS[i].includes(g.dataset.l)?"":"0");
 svg.querySelector(".people").style.opacity=i>=5?"":"0";
 $$(".pstep").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.step===i));
}
function bindProc(){
 if(!$("#procSim"))return;
 $$(".pstep").forEach(b=>b.addEventListener("click",()=>{stopProc();showProc(+b.dataset.step)}));
 const pb=$("#procPlay");
 pb.addEventListener("click",()=>{if(procTimer){stopProc();return}pb.textContent=S[lang].pause;showProc(0);procTimer=setInterval(()=>{if(procStep>=5){stopProc();return}showProc(procStep+1)},1800)});
 showProc(procStep);
}
function stopProc(){clearInterval(procTimer);procTimer=null;const pb=$("#procPlay");if(pb)pb.textContent=S[lang].play}

function summaryText(){
 const x=S[lang],f=$("#wiz");if(!f)return"";
 const type=x.types[f.type.value],stage=x.stages[f.stage.value];
 const disc=[...f.querySelectorAll('input[name=disc]:checked')].map(i=>i.value);
 const names=disc.map(d=>sysList().find(s=>s.id===d).name);
 return {type,stage,area:$("#w-area").value,levels:$("#w-levels").value,disc,names};
}
function renderSummary(){
 const x=S[lang],d=summaryText();if(!d)return;
 const docs=[...x.docsBase,...d.disc.map(k=>x.docsExtra[k]),...(d.stage===x.stages[2]?[x.docsExtra.remodel]:[])];
 $("#summary").innerHTML=`<span class="label">${x.sumTitle}</span>
  <dl><div><dt>${x.q.type}</dt><dd>${d.type}</dd></div><div><dt>${x.q.stage}</dt><dd>${d.stage}</dd></div><div><dt>${x.q.area}</dt><dd>${Number(d.area||0).toLocaleString(lang)} m² · ${d.levels} ${x.q.levels.toLowerCase()}</dd></div>
  <div><dt>${x.q.disc}</dt><dd class="dlist">${d.disc.length?d.disc.map((k,i)=>`<span style="--c:${cv(k)}"><i></i>${d.names[i]}</span>`).join(""):x.none}</dd></div></dl>
  <span class="label" style="margin-top:22px;display:block">${x.docsTitle}</span><ul class="docs">${docs.map(v=>`<li>${v}</li>`).join("")}</ul>
  <button class="btn line dark" type="button" id="copyBtn">${x.copy}</button><p class="copymsg" id="copyMsg" role="status"></p>`;
 $("#copyBtn").addEventListener("click",async()=>{
  const txt=`${x.sumTitle}\n${x.q.type}: ${d.type}\n${x.q.stage}: ${d.stage}\n${x.q.area}: ${d.area} m², ${d.levels} ${x.q.levels.toLowerCase()}\n${x.q.disc}: ${d.names.join(", ")||x.none}`;
  try{await navigator.clipboard.writeText(txt);$("#copyMsg").textContent=x.copied}catch(e){$("#copyMsg").textContent=x.copyFail}
 });
}
function requestText(){
 const x=S[lang],d=summaryText(),v=id=>($("#"+id)||{}).value||"";
 return `${x.waHello}\n\n${x.q.type}: ${d.type}\n${x.q.stage}: ${d.stage}\n${x.q.area}: ${d.area} m², ${d.levels} ${x.q.levels.toLowerCase()}\n${x.q.disc}: ${d.names.join(", ")||x.none}`+(v("w-name")?`\n${x.q.name}: ${v("w-name")}`:"")+(v("w-company")?`\n${x.q.company}: ${v("w-company")}`:"")+(v("w-msg")?`\n${x.q.msg}: ${v("w-msg")}`:"");
}
function updateWa(){const a=$("#wwa");if(a)a.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(requestText())}`}
function bindWizard(){
 const f=$("#wiz");if(!f)return;
 const r=$("#w-range"),a=$("#w-area");
 r.addEventListener("input",()=>{a.value=r.value;renderSummary()});
 a.addEventListener("input",()=>{r.value=Math.min(50000,Math.max(100,a.value||0));renderSummary()});
 f.addEventListener("input",()=>{renderSummary();updateWa()});f.addEventListener("change",()=>{renderSummary();updateWa()});
 f.addEventListener("submit",async e=>{
  e.preventDefault();const x=S[lang],ok=$("#wok"),btn=$("#wsend");
  if(!f.checkValidity()){f.reportValidity();return}
  ok.style.display="block";ok.className="ok";
  if(!FORM_KEY){ok.textContent=x.noKey;ok.classList.add("err");return}
  if(f.botcheck.checked)return;
  btn.disabled=true;ok.textContent=x.sending;
  const d=summaryText(),v=id=>$("#"+id).value;
  const payload={access_key:FORM_KEY,subject:`Solicitud de propuesta · ${d.type} · ${v("w-name")}`,from_name:"Sitio web 3T Consultores",
   nombre:v("w-name"),email:v("w-email"),empresa:v("w-company"),telefono:v("w-phone"),tipo:d.type,etapa:d.stage,area_m2:d.area,niveles:d.levels,
   disciplinas:d.names.join(", ")||"-",comentarios:v("w-msg"),idioma:lang};
  try{
   const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload)});
   const j=await r.json().catch(()=>({}));
   if(r.ok&&j.success!==false){ok.textContent=x.sentOk;f.reset();$("#w-area").value=2500;$("#w-range").value=2500;renderSummary();updateWa()}
   else throw new Error(j.message||r.status);
  }catch(err){ok.textContent=x.sentErr;ok.classList.add("err")}
  finally{btn.disabled=false}
 });
 renderSummary();updateWa();
}
function estimate(){
 const x=S[lang],A=Math.max(0,parseFloat($("#e-area").value)||0),h=HAZ[+$("#e-haz").value];
 const heads=Math.ceil(A/h[0]),da=Math.min(A,h[2]),q=h[1]*da,tot=q+h[3],vol=tot*h[4]/1000;
 const fmt=(v,d=0)=>v.toLocaleString(lang,{maximumFractionDigits:d,minimumFractionDigits:d});
 const gpm=v=>fmt(v/3.785);
 $("#estout").innerHTML=`<div class="big"><b>${fmt(heads)}</b><span>${x.est.heads}</span></div>
  <dl><div><dt>${x.est.cov}</dt><dd>${fmt(h[0],1)} m²</dd></div><div><dt>${x.est.dens}</dt><dd>${fmt(h[1],1)} L/min/m²</dd></div><div><dt>${x.est.darea}</dt><dd>${fmt(da)} m²</dd></div>
  <div><dt>${x.est.flow}</dt><dd>${fmt(q)} L/min · ${gpm(q)} gpm</dd></div><div><dt>${x.est.hose}</dt><dd>${fmt(h[3])} L/min · ${gpm(h[3])} gpm</dd></div>
  <div class="tot"><dt>${x.est.total}</dt><dd>${fmt(tot)} L/min · ${gpm(tot)} gpm</dd></div><div><dt>${x.est.dur}</dt><dd>${h[4]} min</dd></div><div class="tot"><dt>${x.est.vol}</dt><dd>${fmt(vol,1)} m³</dd></div></dl>`;
 // plan drawing
 const n=Math.min(heads,400),cols=Math.max(1,Math.ceil(Math.sqrt(n))),rows=Math.max(1,Math.ceil(n/cols)),Wp=300,cell=Wp/cols,Hp=rows*cell;
 const rad=cell*.62;let dots="";
 for(let k=0;k<n;k++){const cx=(k%cols+.5)*cell,cy=(Math.floor(k/cols)+.5)*cell;dots+=`<g class="hd" style="animation-delay:${Math.min(k*12,1500)}ms"><circle cx="${cx}" cy="${cy}" r="${rad}" fill="color-mix(in srgb,var(--fire) 10%,transparent)" stroke="var(--fire)" stroke-opacity=".35"/><circle cx="${cx}" cy="${cy}" r="${Math.max(1.4,Math.min(3,cell*.08))}" fill="var(--fire)"/></g>`}
 $("#estplan").innerHTML=`<svg viewBox="-10 -10 ${Wp+20} ${Hp+20}" role="img" aria-label="${fmt(heads)} ${x.est.heads}"><defs><clipPath id="clipplan"><rect x="0" y="0" width="${Wp}" height="${Hp}"/></clipPath></defs><rect x="0" y="0" width="${Wp}" height="${Hp}" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.5)"/><g clip-path="url(#clipplan)">${dots}</g></svg>${heads>400?`<p class="note dark">400 / ${fmt(heads)}</p>`:""}`;
}
function bindEst(){if(!$("#e-area"))return;$("#e-area").addEventListener("input",estimate);$("#e-haz").addEventListener("change",estimate);estimate()}
function countUp(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 $$("[data-count]").forEach(el=>{const end=+el.dataset.count,suf=el.dataset.suffix||"",t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/1200),v=Math.round(end*(1-Math.pow(1-k,3)));el.textContent=v+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
function bindSectors(){
 $$("[data-sector]").forEach(el=>el.addEventListener("click",()=>{sector=el.dataset.sector;if(el.tagName==="BUTTON"){render();document.getElementById("tab-"+sector)?.focus()}}));
}

function render(){
 const x=S[lang];simTimers.forEach(clearTimeout);simTimers=[];stopProc();
 let page=(location.hash||"#inicio").slice(1);if(!PAGES.includes(page))page="inicio";
 document.documentElement.lang=lang;
 $("#menuBtn").textContent=x.menu;
 $("#nav").innerHTML=["inicio","servicios","proyectos","nosotros"].map(p=>`<a href="#${p}" ${p===page?'aria-current="page"':""}>${x.nav[p]}</a>`).join("")+`<a class="btn small navcta" href="#propuesta" ${page==="propuesta"?'aria-current="page"':""}>${x.cta}</a>`;
 $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
 $("#main").innerHTML=RENDER[page](x);
 $("#foot").innerHTML=`<div><a class="brand" href="#inicio"><span class="mark">3T</span><b>CONSULTORES</b></a><p style="margin-top:18px">${x.footAbout}</p></div>
  <div><h4>${x.footNav}</h4><ul>${["inicio","servicios","proyectos","nosotros"].map(p=>`<li><a href="#${p}">${x.nav[p]}</a></li>`).join("")}<li><a href="#propuesta">${x.cta}</a></li></ul></div>
  <div><h4>${x.footContact}</h4><ul><li>${L2(CONTACT.addr,CONTACT.addrEn)}</li><li><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></li><li>${CONTACT.phone}</li></ul></div>`;
 $("#legal").innerHTML=`<span>${x.legal}</span><span>${x.tagline}</span>`;
 bindSim();bindSys();bindProc();bindWizard();bindEst();bindSectors();countUp();
}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("3t-lang",lang)}catch(e){}render()}));
$("#menuBtn").addEventListener("click",()=>{const n=$("#nav");const o=n.classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)});
window.addEventListener("hashchange",()=>{$("#nav").classList.remove("open");render();window.scrollTo(0,0)});
render();

</script>
